name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distro:
    name: Tests (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:12", "fedora:43"]
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install test tools
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              bash coreutils curl util-linux systemd dbus-daemon desktop-file-utils \
              libglib2.0-bin gsettings-desktop-schemas cinnamon-desktop-data \
              libkf5config-bin git ca-certificates passwd
          else
            dnf install -y bash coreutils curl-minimal util-linux systemd dbus-daemon \
              desktop-file-utils glib2 gsettings-desktop-schemas kf6-kconfig \
              git ca-certificates shadow-utils
          fi
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          for file in install.sh rolimnet-wallpaper build_appimage.sh appimage/AppRun appimage/result.sh tests/*.sh; do
            bash -n "$file"
          done
          cmp install.sh rolimnet-wallpaper
      - name: Run isolated lifecycle and native settings tests
        run: |
          useradd --create-home --uid 1001 tester
          chown -R tester:tester "$GITHUB_WORKSPACE"
          runuser -u tester -- bash -c '
            set -e
            cd "$GITHUB_WORKSPACE"
            bash tests/test.sh
            bash tests/test_system.sh
            bash tests/test_appimage.sh
            REQUIRE_KDE=1 bash tests/test_desktop.sh
          '

  package:
    runs-on: ubuntu-latest
    needs: distro
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Get official AppImage tools
        run: |
          curl -fL --retry 3 -o /tmp/appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          curl -fL --retry 3 -o /tmp/runtime-x86_64 \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          chmod +x /tmp/appimagetool.AppImage
          cat > /tmp/wallpaper-appimagetool <<'TOOL'
          #!/usr/bin/env bash
          exec /tmp/appimagetool.AppImage --runtime-file /tmp/runtime-x86_64 "$@"
          TOOL
          chmod +x /tmp/wallpaper-appimagetool
      - name: Build and verify packaged agent
        run: |
          APPIMAGETOOL=/tmp/wallpaper-appimagetool bash build_appimage.sh
          ./Rolimnet-Wallpaper-x86_64.AppImage --appimage-extract-and-run --help
          stage=$(mktemp -d)
          package="$PWD/Rolimnet-Wallpaper-x86_64.AppImage"
          source_dir=$PWD
          cd "$stage"
          "$package" --appimage-extract
          cmp squashfs-root/usr/bin/rolimnet-wallpaper "$source_dir/install.sh"
          cp -r "$source_dir/tests" .
          cp squashfs-root/usr/bin/rolimnet-wallpaper install.sh
          cp install.sh rolimnet-wallpaper
          bash tests/test.sh
          bash tests/test_system.sh
          cd "$source_dir"
          sha256sum Rolimnet-Wallpaper-x86_64.AppImage rolimnet-wallpaper > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Rolimnet-Wallpaper-Linux-x86_64
          path: |
            Rolimnet-Wallpaper-x86_64.AppImage
            rolimnet-wallpaper
            SHA256SUMS
          if-no-files-found: error
